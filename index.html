<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Style Critic AI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Style Critic AI</h1>
    </header>
    <main>
        <p>Upload a photo of an outfit and our AI will critique it.</p>
        <form id="upload-form">
            <input type="file" id="image-upload" name="image" accept="image/*" required>
            <button type="submit">Get Critique</button>
        </form>
        <section id="results-container" style="display: none;">
            <h2>Critique</h2>
            <div id="critique-output"></div>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
